<details class="mission-item" name="misiones-kubiq"{{abierto}}>
  <summary>
    <span class="mission-item-title"><small>{{programa}}</small><strong>{{titulo}}</strong></span>
    <span class="mission-toggle" aria-hidden="true"></span>
    <picture class="mission-art">{{fuenteEstatica}}<img alt="{{alternativo}}" loading="lazy" src="{{imagen}}"/></picture>
  </summary>
  <div class="mission-content">
    <p>{{descripcion}}</p>
    <a class="mission-card-link" href="{{ruta}}">Explorar {{programa}} →</a>
  </div>
</details>
