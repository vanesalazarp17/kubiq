<script>
(function(){const form=document.getElementById('programEnrollForm');if(!form)return;const select=document.getElementById('programSelect');document.querySelectorAll('[data-program]').forEach(btn=>btn.addEventListener('click',()=>{if(select)select.value=btn.dataset.program;}));form.addEventListener('submit',function(e){e.preventDefault();if(!form.reportValidity())return;const d=new FormData(form);const lines=['Hola KUBIQ ACADEMY, deseo solicitar información de matrícula.','Representante: '+d.get('representante'),'WhatsApp de contacto: '+d.get('whatsapp'),'Edad del estudiante: '+d.get('edad'),'Programa: '+d.get('programa'),'Días preferidos: '+(d.getAll('dias').join(', ')||'Por coordinar'),'Horario preferido: '+(d.get('horario')||'Por coordinar'),'Mensaje: '+(d.get('mensaje')||'Sin mensaje adicional'),'Consentimiento para responder esta solicitud: Sí'];window.open('https://wa.me/593984538209?text='+encodeURIComponent(lines.join('\n')),'_blank','noopener');});const params=new URLSearchParams(location.search);if(params.get('programa')&&select)select.value=params.get('programa');})();</script>
