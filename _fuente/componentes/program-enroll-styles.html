<style id="program-enroll-styles">.session-length{display:inline-flex;flex-wrap:wrap;background:#f0edff;color:#6140ce;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.program-enroll{padding:64px 0;background:linear-gradient(135deg,#f3f8ff,#f5f0ff)}.program-enroll-form{display:grid;margin-inline:auto;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:850px;padding:24px;background:#fff;border:1px solid #dfe5f5;border-radius:22px;box-shadow:0 16px 40px #0b1b4d12}.program-enroll-form label{display:flex;flex-direction:column;gap:7px;color:#0b1b4d;font-size:13px;font-weight:800}.program-enroll-form input,.program-enroll-form select,.program-enroll-form textarea{width:100%;border:1px solid #dce4f2;border-radius:12px;padding:12px;font:inherit;color:#0b1b4d;background:#fbfcff}.program-enroll-form .full{grid-column:1/-1}.program-enroll-form button{grid-column:1/-1;justify-self:center;min-width:260px}.program-enroll{scroll-margin-top:30px}@media(max-width:650px){.program-enroll-form{grid-template-columns:1fr;padding:16px}.program-enroll-form .full,.program-enroll-form button{grid-column:1}.program-enroll-form button{width:100%;min-width:0}}</style>
