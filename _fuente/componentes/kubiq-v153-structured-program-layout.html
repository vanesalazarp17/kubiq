<style id="kubiq-v153-structured-program-layout">
/* Estructura uniforme y legible para Roblox, Python y Scratch */
.program-sales-showcase{padding:clamp(48px,6vw,82px) 0;overflow:hidden}
.program-sales-showcase .wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}
.program-sales-showcase .sales-head{max-width:850px;margin:0 auto 34px;text-align:center}
.program-sales-showcase .sales-head h2{line-height:1.12;text-wrap:balance;margin:12px 0}
.program-sales-showcase .sales-head p,.sales-project-heading p{line-height:1.7}
.program-sales-showcase .sales-project-heading{max-width:850px;margin:0 auto 22px;text-align:center}
.program-sales-showcase .sales-projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;overflow:visible;padding:0}
.program-sales-showcase .sales-project{min-width:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e3eaf8;border-radius:22px;background:#fff;box-shadow:0 12px 30px rgba(11,27,77,.08)}
.program-sales-showcase .project-image-wrap{position:relative;aspect-ratio:16/10;overflow:hidden;background:#eef3ff}
.program-sales-showcase .project-image-wrap img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.program-sales-showcase .project-copy{padding:18px 20px 22px}
.program-sales-showcase .project-copy strong{display:block;color:#0b1b4d;font-size:18px;line-height:1.25;margin:6px 0 9px}
.program-sales-showcase .project-copy p{margin:0;color:#59647e;font-size:14px;line-height:1.6}
.program-sales-showcase .sales-trustline{max-width:850px;margin:28px auto 0;text-align:center;line-height:1.65}
.skills-transfer{padding:clamp(48px,6vw,76px) 0;background:linear-gradient(180deg,#f8faff,#fff)}
.skills-transfer .intro{max-width:850px;margin:0 auto 28px;text-align:center}
.life-skills-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.life-skill-card{min-width:0;min-height:190px;padding:19px 18px;border:1px solid #e2e8f6;border-radius:18px;background:linear-gradient(145deg,#fff,#f8faff);box-shadow:0 8px 22px rgba(11,27,77,.055)}
.life-skill-icon{display:grid;place-items:center;width:38px;height:38px;margin-bottom:12px;border-radius:12px;background:#f0edff;color:#7048e8;font-size:20px;font-weight:900}
.life-skill-kicker{display:block;margin-bottom:6px;color:#6e7a9b;font-size:9px;font-weight:900;letter-spacing:.13em}
.life-skill-card h3{margin:0 0 7px;color:#0b1b4d;font-size:15px;line-height:1.25}
.life-skill-card p{margin:0;color:#66718a;font-size:12px;line-height:1.55}
@media(max-width:900px){.life-skills-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.program-sales-showcase .sales-projects{gap:14px}}
@media(max-width:650px){.program-sales-showcase .wrap{width:calc(100% - 32px)}.program-sales-showcase .sales-projects{grid-template-columns:1fr;gap:16px}.program-sales-showcase .project-image-wrap{aspect-ratio:16/9}.program-sales-showcase .project-copy{padding:16px}.life-skills-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.life-skill-card{min-height:0;padding:14px 13px;border-radius:15px}.life-skill-card h3{font-size:13px}.life-skill-card p{font-size:11px;line-height:1.5}.life-skill-icon{width:34px;height:34px;margin-bottom:9px}}
@media(max-width:360px){.life-skills-grid{grid-template-columns:1fr}.life-skill-card{padding:16px}}
</style>
