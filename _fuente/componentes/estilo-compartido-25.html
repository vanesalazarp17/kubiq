<style>
:root{--navy:#0B1B4D;--cyan:#00C8FF;--violet:#7B4DFF;--ink:#18213d;--muted:#65708b;--line:#e6eaf5}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,sans-serif;color:var(--ink);line-height:1.65}a{color:inherit;text-decoration:none}.wrap{width:min(1080px,calc(100% - 40px));margin:auto}
header{border-bottom:1px solid var(--line);background:#fff}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font:900 clamp(21px,3vw,30px) Poppins,sans-serif;letter-spacing:-.045em;color:var(--navy);white-space:nowrap}.brand span{color:var(--violet)}.nav a:last-child{font-weight:800;color:var(--navy)}
.hero{background:radial-gradient(circle at 85% 15%,#7b4dff55,transparent 30%),linear-gradient(125deg,#0B1B4D,#101a52);color:#fff;padding:72px 0 68px}.eyebrow{color:#9cecff;font-size:12px;letter-spacing:.15em;font-weight:900}h1,h2,h3{font-family:Poppins,sans-serif;line-height:1.15}h1{font-size:clamp(36px,6vw,62px);letter-spacing:-.055em;max-width:850px;margin:16px 0}.hero p{font-size:17px;color:#d9e2ff;max-width:780px}.btn{display:inline-flex;padding:14px 20px;border-radius:999px;background:var(--cyan);color:var(--navy);font-weight:900;margin:12px 10px 0 0}.btn-outline{background:#f0f2ff;color:var(--navy)}
section{padding:64px 0}.intro{max-width:760px;margin-bottom:30px}.intro h2{color:var(--navy);font-size:clamp(27px,4vw,40px);margin:0 0 12px}.intro p{color:var(--muted)}.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.level-card{border:1px solid var(--line);border-radius:22px;padding:26px;background:#fff;box-shadow:0 14px 35px #0b1b4d0b}.level-age{display:inline-block;padding:6px 11px;background:#e9e6ff;border-radius:999px;color:var(--navy);font-weight:900;font-size:12px}.level-card h3{color:var(--navy);font-size:22px;margin:14px 0 8px}.level-card p{color:var(--muted);font-size:14px}.level-tags{padding:12px;background:#f6f8ff;border-radius:12px;color:#364365;font-size:13px;line-height:1.7}.skills{background:#f6f8ff}.skill-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.skill-grid li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--navy);font-weight:800;font-size:13px;list-style:none}.skill-grid{padding:0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.facts div{text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.facts strong{display:block;color:var(--navy);font:800 18px Poppins}.facts span{font-size:12px;color:var(--muted)}.faq details{border-bottom:1px solid var(--line);padding:17px 0}.faq summary{font-weight:900;color:var(--navy);cursor:pointer}.faq p{color:var(--muted)}.cta{background:#0B1B4D;color:#fff;text-align:center;padding:58px 0}.cta h2{font-size:clamp(26px,4vw,40px);max-width:780px;margin:0 auto 12px}.cta p{color:#d9e2ff;max-width:650px;margin:0 auto}footer{background:#071234;color:#cbd5f5;padding:24px 0;font-size:13px}footer .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}@media(max-width:760px){.levels{grid-template-columns:1fr}.skill-grid{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:repeat(2,1fr)}.hero{padding:54px 0}}

/* KUBIQ V73 — páginas de programa: mundos visuales más vivos y navegación clara */
.nav{min-height:82px;height:auto;padding:10px 0}.nav a:last-child{font-size:13px;padding:10px 15px;border-radius:999px;background:#f0edff;color:#5532c8;transition:background .2s,transform .2s}.nav a:last-child:hover{background:#e3dcff;transform:translateX(-2px)}
.hero{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 82% 18%,rgba(0,200,255,.30),transparent 24%),radial-gradient(circle at 15% 88%,rgba(123,77,255,.42),transparent 30%),linear-gradient(125deg,#0B1B4D 0%,#172b69 56%,#35216e 100%)}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border:1px solid rgba(255,255,255,.18);border-radius:28px;transform:rotate(28deg);pointer-events:none}.hero:before{width:190px;height:190px;right:8%;top:10%;box-shadow:0 0 0 18px rgba(0,200,255,.045),0 0 0 38px rgba(123,77,255,.04)}.hero:after{width:90px;height:90px;right:27%;bottom:5%;border-color:rgba(0,200,255,.32)}
.hero .wrap{position:relative}.hero .eyebrow{display:inline-flex;padding:7px 12px;border:1px solid rgba(156,236,255,.28);border-radius:999px;background:rgba(255,255,255,.07)}
.btn{padding:14px 22px;border-radius:14px;box-shadow:0 9px 22px rgba(0,200,255,.18);transition:transform .2s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-3px);box-shadow:0 14px 26px rgba(0,200,255,.26)}.btn-outline{background:#f0edff;color:#5634c7;border:1px solid #ded6ff;box-shadow:none}.btn-outline:hover{background:#e6e0ff;box-shadow:0 10px 20px rgba(123,77,255,.15)}
.level-card{position:relative;overflow:hidden;border:1px solid #e1e6fb;border-radius:24px;background:linear-gradient(155deg,#fff 0%,#f8faff 100%);box-shadow:0 14px 35px rgba(11,27,77,.08);transition:transform .25s,box-shadow .25s}.level-card:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#00C8FF,#7B4DFF,#FFC928)}.level-card:hover{transform:translateY(-5px);box-shadow:0 20px 42px rgba(11,27,77,.13)}.level-age{background:#e8f9ff;color:#08799b}.level-card:nth-child(2) .level-age{background:#eee9ff;color:#6845c8}.level-tags{background:linear-gradient(110deg,#eefaff,#f3efff);border:1px solid #e3e9ff;color:#34466e}
.skills{background:linear-gradient(135deg,#eefaff 0%,#f4f0ff 55%,#fff8e8 100%)}.skill-grid li{position:relative;border-radius:17px;box-shadow:0 8px 22px rgba(11,27,77,.06);transition:transform .2s,box-shadow .2s}.skill-grid li:hover{transform:translateY(-4px);box-shadow:0 13px 27px rgba(11,27,77,.11)}.skill-grid li:nth-child(3n+1){border-top:4px solid #00C8FF}.skill-grid li:nth-child(3n+2){border-top:4px solid #7B4DFF}.skill-grid li:nth-child(3n){border-top:4px solid #FFC928}
.facts div{background:linear-gradient(150deg,#fff,#f7f8ff);border-color:#e3e8f7;box-shadow:0 8px 22px rgba(11,27,77,.05)}.facts div:nth-child(2n) strong{color:#7049df}.facts div:nth-child(2n+1) strong{color:#078cb2}
.faq details{padding:18px 16px;border:1px solid #e6eaf5;border-radius:14px;margin:9px 0;background:#fff}.faq summary{list-style:none}.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:"+";float:right;color:#7B4DFF;font-size:21px;line-height:1}.faq details[open] summary:after{content:"−"}.faq details[open]{background:#fafaff;border-color:#dcd5ff}
.cta{background:radial-gradient(circle at 80% 20%,rgba(0,200,255,.22),transparent 28%),linear-gradient(120deg,#0B1B4D,#251c63)}
@media(max-width:760px){.nav{min-height:72px}.brand{font-size:23px}.hero:before{right:-45px;top:12%;width:130px;height:130px}.hero:after{right:16%;bottom:3%;width:65px;height:65px}.level-card{padding:22px}.btn{margin-right:6px}}
@media(prefers-reduced-motion:reduce){.level-card,.skill-grid li,.btn,.nav a:last-child{transition:none!important}.level-card:hover,.skill-grid li:hover,.btn:hover{transform:none}}
 .program-nav{display:flex;gap:9px;align-items:center}.program-nav a{font-size:12px;font-weight:900;color:#5532c8;text-decoration:none;padding:9px 12px;border-radius:999px;background:#f0edff}.session-length{display:inline-block;margin:8px 0;padding:5px 9px;border-radius:20px;background:#e4f8ff;color:#08799b;font-size:11px;font-weight:900}

.level-card .python-advanced-gif{display:block;width:min(100%,210px);height:auto;max-height:210px;object-fit:contain;margin:14px auto 0;border-radius:16px}
.level-card .btn-outline{display:inline-flex;align-items:center;justify-content:center}
@media(max-width:650px){.program-hero-gif{margin:20px auto 0;width:min(65vw,220px)}}
